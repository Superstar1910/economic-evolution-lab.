name: Atlas API smoke extract
on:
  workflow_dispatch:
    inputs:
      country:
        description: "ISO3 country code (single country)"
        required: true
        default: "UGA"
      year:
        description: "One historical year"
        required: true
        default: "2022"
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Extract one country-year
        env:
          COUNTRY: ${{ inputs.country }}
          YEAR: ${{ inputs.year }}
        run: |
          python -m evolution_lab.cli extract-atlas --countries "$COUNTRY" --start "$YEAR" --end "$YEAR" --output data/raw/atlas_smoke.csv
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-smoke-extract
          path: |
            data/raw/atlas_smoke.csv
            data/raw/atlas_smoke.manifest.json
          retention-days: 14
